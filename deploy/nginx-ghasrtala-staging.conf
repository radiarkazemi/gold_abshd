        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header Set-Cookie "ghasrtala_stg=1; Path=/; Max-Age=604800; HttpOnly; SameSite=Lax" always;
    }

    location = /index.html {
        auth_basic "Staging — admins only";
        auth_basic_user_file /etc/nginx/ghasrtala-staging.htpasswd;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Goldapp-Env "staging" always;
        add_header Set-Cookie "ghasrtala_stg=1; Path=/; Max-Age=604800; HttpOnly; SameSite=Lax" always;
    }

    location = /version.json {
