# Staging nginx — isolated from production.
# - http://ghasrtala.ir:8080  (works immediately, no DNS)
# - http://dev.ghasrtala.ir   (after DNS A-record → same server)
# Gate: HTTP basic auth for radiar + sasanHKH only

limit_req_zone $binary_remote_addr zone=staging_api_limit:10m rate=30r/s;

# Port 80 subdomain (optional DNS)
server {
    listen 80;
    listen [::]:80;
    server_name dev.ghasrtala.ir staging.ghasrtala.ir;

    auth_basic "Staging — admins only";
    auth_basic_user_file /etc/nginx/ghasrtala-staging.htpasswd;

    add_header X-Goldapp-Env "staging" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    client_max_body_size 12m;

    root /opt/ghasrtala/gold_abshd_staging/frontend/dist;
    index index.html;

    location / { try_files $uri $uri/ /index.html; }
    location /assets/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header X-Goldapp-Env "staging" always;
    }
    location = /version.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }
    location /api/ {
        limit_req zone=staging_api_limit burst=40 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location ~ /\. { deny all; access_log off; log_not_found off; }
}

# Port 8080 on all hostnames (IP / ghasrtala.ir:8080) — primary staging entry now
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    auth_basic "Staging — admins only";
    auth_basic_user_file /etc/nginx/ghasrtala-staging.htpasswd;

    add_header X-Goldapp-Env "staging" always;
