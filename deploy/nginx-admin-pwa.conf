# Admin panel as its own PWA (not a Chrome shortcut of the customer app).
location = /admin-hs-panel {
    return 301 /admin-hs-panel/;
}

location = /admin-hs-panel/sw.js {
    add_header Cache-Control "no-cache, must-revalidate";
    add_header Service-Worker-Allowed "/admin-hs-panel/";
}

location = /admin-hs-panel/ {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Pragma "no-cache";
    try_files /admin.html /index.html;
}

location = /admin.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Pragma "no-cache";
}

location = /admin-manifest.json {
    add_header Cache-Control "no-cache, must-revalidate";
}

location = /client-manifest.json {
    add_header Cache-Control "no-cache, must-revalidate";
}
